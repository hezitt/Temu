[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "temu-pbn-automation"
version = "0.1.0"
description = "Database-first automation foundation for a Temu paint-by-numbers business"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*", "core*", "models*", "modules*", "integrations*", "services*", "repositories*", "schemas*", "jobs*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["postgresql: optional integration test requiring TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/import_factory_quote.py" = ["E402"]
"scripts/generate_temu_listing.py" = ["E402"]
"scripts/import_fulfillment_rules.py" = ["E402"]
"scripts/sync_dianxiaomi_listing.py" = ["E402"]
"scripts/import_product_intake.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
