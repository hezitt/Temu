services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temu_pbn
      POSTGRES_USER: temu_pbn
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temu_pbn -d temu_pbn"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

